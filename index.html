<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propavshiy Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    html { scroll-behavior: smooth; }
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #02040a; 
      color: #94a3b8; 
    }

    /* Стиль Verturi */
    .v-card {
      background: rgba(8, 17, 43, 0.4);
      border: 1px solid rgba(30, 58, 138, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 16px;
    }

    /* Анимация 3-х точек и меню */
    #dropdown { 
      display: none; position: absolute; top: 50px; right: 16px; 
      background: #08112b; border: 1px solid #1e3a8a; border-radius: 12px; 
      width: 180px; z-index: 1000;
    }
    .menu-in { display: block !important; animation: v-in 0.25s ease-out forwards; }
    .menu-out { display: block !important; animation: v-out 0.2s ease-in forwards; pointer-events: none; }
    @keyframes v-in { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes v-out { from { opacity: 1; transform: scale(1) translateY(0); } to { opacity: 0; transform: scale(0.95) translateY(-10px); } }

    /* Горизонтальный свайп по 4 трека */
    .swipe-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 20px;
      scrollbar-width: none;
    }
    .swipe-container::-webkit-scrollbar { display: none; }
    .swipe-page {
      min-width: 100%;
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
    }

    /* Плеер */
    #player { 
      position: fixed; bottom: 0; left: 0; right: 0; 
      background: rgba(5, 10, 24, 0.98); border-top: 1px solid #1e3a8a;
      transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100; padding-bottom: 30px;
    }
    #player.active { transform: translateY(0); }

    .press-anim:active { transform: scale(0.95); transition: 0.1s; }
  </style>
</head>
<body class="pb-40">

<div class="max-w-md mx-auto pt-8 px-6">
  <div class="flex justify-between items-center text-[11px] text-gray-500 mb-10 relative font-mono">
    <span>PROPAVSHIY.SPACE</span>
    <div class="relative">
      <div onclick="toggleMenu()" class="cursor-pointer p-2"><i id="dots" class="fa-solid fa-ellipsis-vertical text-blue-500 text-lg transition-transform"></i></div>
      <div id="dropdown">
        <div class="p-4 border-b border-blue-900/30 text-white text-xs" onclick="goto('home')">Главная</div>
        <div class="p-4 border-b border-blue-900/30 text-white text-xs" onclick="goto('track')">Мои треки</div>
        <div class="p-4 text-white text-xs" onclick="goto('sell')">Sell Username</div>
      </div>
    </div>
  </div>

  <div id="home" class="text-center mb-10">
    <img src="https://files.catbox.moe/yonydu.jpg" class="w-24 h-24 rounded-full mx-auto border-2 border-blue-600 p-1 mb-4 shadow-[0_0_20px_rgba(37,99,235,0.4)]">
    <h1 class="text-4xl font-extrabold text-white tracking-tighter">Propavshiy</h1>
    <p class="text-blue-500 font-bold text-sm mt-1 uppercase tracking-widest">@Propavshiy_Wexon</p>
  </div>

  <div class="mb-10">
    <p class="text-[9px] uppercase tracking-[0.3em] text-gray-700 mb-3">Now Playing</p>
    <div onclick="togglePlay()" class="v-card p-4 flex items-center gap-4 cursor-pointer press-anim">
      <img id="np-cover" src="https://files.catbox.moe/vfxsnu.jpg" class="w-12 h-12 rounded-lg object-cover">
      <div class="flex-1">
        <div id="np-title" class="text-white text-sm font-bold">Ну какая ты</div>
        <div class="text-gray-500 text-[10px]">Propavshiy</div>
      </div>
      <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white"><i id="np-icon" class="fa-solid fa-play"></i></div>
    </div>
  </div>

  <div id="track" class="mb-10">
    <div class="flex justify-between items-center mb-4">
      <p class="text-[9px] uppercase tracking-[0.3em] text-gray-700">Мои плейлисты</p>
      <div class="flex items-center gap-2 text-blue-500 text-[10px] font-bold">
        свайпай <i class="fa-solid fa-arrow-right animate-bounce-x"></i>
      </div>
    </div>
    
    <div id="swipe-box" class="swipe-container">
      </div>
  </div>

  <div id="sell" class="mb-10">
    <p class="text-[9px] uppercase tracking-[0.3em] text-gray-700 mb-3">Sell Username</p>
    <div class="v-card overflow-hidden">
      <div class="p-4 text-center border-b border-blue-900/20"><span class="text-blue-400 font-mono font-bold">@Error_466</span></div>
      <div class="p-4 text-center border-b border-blue-900/20"><span class="text-white font-mono font-bold">@OHA_M777KA</span></div>
      <div class="p-4 text-center border-b border-blue-900/20"><span class="text-white font-mono font-bold">@OHA_F9O</span></div>
      <div class="p-4 text-center border-b border-blue-900/20"><span class="text-blue-400 font-mono font-bold">@OHA_M5F9O_CS</span></div>
      <div class="p-4 text-center"><span class="text-white font-mono font-bold">@OHA_M5G9O</span></div>
    </div>
    <a href="https://t.me/Propavshiy_Wexon" target="_blank" class="mt-4 flex items-center justify-center gap-2 bg-blue-600 py-4 rounded-xl text-white font-bold text-xs uppercase tracking-widest press-anim shadow-lg shadow-blue-900/20">
      <i class="fa-brands fa-telegram text-lg"></i> связаться в telegram
    </a>
  </div>
</div>

<div id="player">
  <div class="max-w-md mx-auto px-6 py-4 flex items-center gap-4">
    <img id="p-cover" src="" class="w-12 h-12 rounded-lg object-cover shadow-lg">
    <div class="flex-1 min-w-0">
      <div id="p-title" class="text-white font-bold text-xs truncate">Title</div>
      <div class="w-full h-1 bg-gray-800 rounded-full mt-3"><div id="p-bar" class="h-full bg-blue-600 w-0"></div></div>
    </div>
    <div class="flex items-center gap-4">
      <i onclick="prev()" class="fa-solid fa-backward-step text-gray-500"></i>
      <div onclick="togglePlay()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-black"><i id="p-icon" class="fa-solid fa-play"></i></div>
      <i onclick="next()" class="fa-solid fa-forward-step text-gray-500"></i>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
  const tracks = [
    { title: "Ну какая ты", cover: "https://files.catbox.moe/vfxsnu.jpg", url: "https://files.catbox.moe/ze0xwj.m4a" },
    { title: "Бессильно", cover: "https://files.catbox.moe/xdmwkt.jpg", url: "https://files.catbox.moe/9ibdq9.mp3" },
    { title: "Диалог", cover: "https://files.catbox.moe/a1c0xn.jpg", url: "https://files.catbox.moe/huwdrn.mp3" },
    { title: "Наше время", cover: "https://files.catbox.moe/qqdlh3.jpg", url: "https://files.catbox.moe/l166uq.mp3" },
    { title: "Never Allow", cover: "https://files.catbox.moe/rpsk7t.jpg", url: "https://files.catbox.moe/rkfip7.m4a" },
    { title: "Зима", cover: "https://files.catbox.moe/1e8qa7.jpg", url: "https://files.catbox.moe/0w2yvl.m4a" },
    { title: "8 миля", cover: "https://files.catbox.moe/gggc5y.png", url: "https://files.catbox.moe/tcu8te.m4a" },
    { title: "Наоборот", cover: "https://files.catbox.moe/yjbba7.png", url: "https://files.catbox.moe/awz24d.m4a" },
    { title: "Устал", cover: "https://files.catbox.moe/qzb3c1.webp", url: "https://files.catbox.moe/7dozr5.mp3" },
    { title: "Миражи", cover: "https://files.catbox.moe/lqqz2a.jpg", url: "https://files.catbox.moe/gkicn1.mp3" },
    { title: "Алготрип", cover: "https://files.catbox.moe/lx8y0e.jpg", url: "https://files.catbox.moe/6hrc02.mp3" },
    { title: "Скучаю", cover: "https://files.catbox.moe/5ppugw.jpg", url: "https://files.catbox.moe/grb3mq.mp3" },
    { title: "Ты это знала", cover: "https://files.catbox.moe/262vto.jpg", url: "https://files.catbox.moe/hqv1pk.mp3" },
    { title: "Раны", cover: "https://files.catbox.moe/wuqkfr.jpg", url: "https://files.catbox.moe/rln061.mp3" },
    { title: "Одиноко", cover: "https://files.catbox.moe/wl9oof.jpg", url: "https://files.catbox.moe/xlh67f.mp3" },
    { title: "кровати", cover: "https://files.catbox.moe/49bzxd.jpg", url: "https://files.catbox.moe/noulzy.mp3" }
  ];

  let cur = 0;
  let playing = false;
  const audio = document.getElementById('audio');

  function render() {
    const box = document.getElementById('swipe-box');
    for (let i = 0; i < tracks.length; i += 4) {
      const page = document.createElement('div');
      page.className = 'swipe-page';
      page.innerHTML = tracks.slice(i, i+4).map((t, idx) => `
        <div onclick="play(${i + idx})" class="v-card p-2 press-anim cursor-pointer text-center">
          <img src="${t.cover}" class="w-full aspect-square object-cover rounded-xl mb-2 shadow-lg">
          <div class="text-[10px] font-bold text-white truncate px-1">${t.title}</div>
          <div class="text-[8px] text-gray-500">Propavshiy</div>
        </div>
      `).join('');
      box.appendChild(page);
    }
  }

  function play(i) {
    cur = i;
    const t = tracks[i];
    audio.src = t.url;
    document.getElementById('p-cover').src = t.cover;
    document.getElementById('p-title').innerText = t.title;
    document.getElementById('np-cover').src = t.cover;
    document.getElementById('np-title').innerText = t.title;
    audio.play();
    playing = true;
    document.getElementById('player').classList.add('active');
    update();
  }

  function togglePlay() {
    if (!audio.src) { play(0); return; }
    if (playing) audio.pause(); else audio.play();
    playing = !playing;
    update();
  }

  function update() {
    const icon = playing ? 'fa-pause' : 'fa-play';
    document.getElementById('np-icon').className = 'fa-solid ' + icon;
    document.getElementById('p-icon').className = 'fa-solid ' + icon;
  }

  audio.ontimeupdate = () => {
    document.getElementById('p-bar').style.width = (audio.currentTime / audio.duration) * 100 + '%';
  };

  function next() { play((cur + 1) % tracks.length); }
  function prev() { play((cur - 1 + tracks.length) % tracks.length); }

  function toggleMenu() {
    const d = document.getElementById('dropdown');
    const i = document.getElementById('dots');
    if (d.classList.contains('menu-in')) {
      d.classList.replace('menu-in', 'menu-out');
      i.style.transform = 'rotate(0deg)';
      setTimeout(() => { d.style.display = 'none'; d.classList.remove('menu-out'); }, 200);
    } else {
      d.style.display = 'block';
      d.classList.add('menu-in');
      i.style.transform = 'rotate(90deg)';
    }
  }

  function goto(id) {
    toggleMenu();
    document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
  }

  window.onload = render;
</script>

<style>
  @keyframes bounce-x {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(5px); }
  }
  .animate-bounce-x { animation: bounce-x 1s infinite; }
</style>
</body>
</html>
